<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>All Patients - MediTrack</title><link rel="stylesheet" href="../../css/main.css"/></head>
<body>
<div id="toast-container"></div>
<div class="app-layout">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>
    <main class="page-content">
      <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <div><h2>All Patients</h2><p>View and manage registered patients</p></div>
        <input type="text" class="form-control" id="search-patients" placeholder="Search patients..." style="width:240px;"/>
      </div>
      <div class="table-wrapper" id="patients-table"><div class="spinner" style="margin:60px auto;"></div></div>
    </main>
  </div>
</div>
<!-- Patient Detail Modal -->
<div id="patient-modal" class="modal-overlay" style="display:none;">
  <div class="modal modal--lg">
    <div class="modal-header">
      <h2 class="modal-title">Patient Details</h2>
      <button class="modal-close" id="close-patient-modal" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div id="patient-modal-content"></div>
  </div>
</div>
<script type="module" src="../../js/pages/admin-patients.js"></script>
</body>
</html>
