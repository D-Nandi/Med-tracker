<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Doctor Dashboard - MediTrack</title><link rel="stylesheet" href="../../css/main.css"/></head>
<body>
<div id="toast-container"></div>
<div class="app-layout">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>
    <main class="page-content">
      <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <div><h2 id="welcome-msg">Welcome, Doctor</h2><p>Here's an overview of your practice</p></div>
        <a href="/pages/doctor/prescriptions.html" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Prescription
        </a>
      </div>
      <div class="stats-grid" id="stats-grid"></div>
      <div class="dashboard-grid" style="margin-top:24px;">
        <div class="card">
          <div class="card-header"><span class="card-title">Recent Patients</span><a href="/pages/doctor/patients.html" class="btn btn-ghost btn-sm">View All</a></div>
          <div id="recent-patients"><div class="spinner" style="margin:30px auto;"></div></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Today's Appointments</span><a href="/pages/doctor/appointments.html" class="btn btn-ghost btn-sm">View All</a></div>
          <div id="today-appointments"><div class="spinner" style="margin:30px auto;"></div></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script type="module" src="../../js/pages/doctor-dashboard.js"></script>
</body>
</html>
