<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - MediTrack</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#f0f9ff 0%,#ecfeff 50%,#f0fdf4 100%);}
    .auth-card{width:100%;max-width:440px;background:white;border-radius:var(--radius-xl);padding:40px;box-shadow:var(--shadow-xl);border:1px solid var(--color-border);}
    .auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px;}
    .auth-logo-icon{width:44px;height:44px;background:var(--color-primary);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:white;}
    .auth-logo-text{font-family:var(--font-primary);font-weight:700;font-size:1.4rem;color:var(--color-foreground);}
    .auth-logo-text span{color:var(--color-primary);}
    .auth-title{text-align:center;font-size:1.5rem;font-weight:700;margin-bottom:6px;}
    .auth-sub{text-align:center;color:var(--color-muted-text);font-size:0.9375rem;margin-bottom:28px;}
    .auth-footer{text-align:center;margin-top:20px;font-size:0.9rem;color:var(--color-muted-text);}
    .auth-footer a{color:var(--color-primary);font-weight:600;}
    .role-tabs{display:flex;background:var(--color-muted);border-radius:var(--radius-md);padding:4px;gap:4px;margin-bottom:24px;}
    .role-tab{flex:1;padding:8px;border-radius:var(--radius-sm);border:none;background:none;font-size:0.875rem;font-weight:500;color:var(--color-muted-text);cursor:pointer;transition:all var(--transition);}
    .role-tab.active{background:white;color:var(--color-primary);font-weight:600;box-shadow:var(--shadow-sm);}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--color-muted-text);font-size:0.875rem;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--color-border);}
    .forgot-link{font-size:0.875rem;color:var(--color-primary);font-weight:600;float:right;}
    .pw-wrapper{position:relative;}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--color-muted-text);padding:4px;}
  </style>
</head>
<body>
<div id="toast-container"></div>
<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-logo-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
    <div class="auth-logo-text">Medi<span>Track</span></div>
  </div>
  <h1 class="auth-title">Welcome Back</h1>
  <p class="auth-sub">Sign in to your MediTrack account</p>
  <div class="role-tabs" role="tablist">
    <button class="role-tab active" data-role="patient" role="tab" aria-selected="true">Patient</button>
    <button class="role-tab" data-role="doctor" role="tab" aria-selected="false">Doctor</button>
    <button class="role-tab" data-role="admin" role="tab" aria-selected="false">Admin</button>
  </div>
  <form id="login-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input class="form-control" type="email" id="email" placeholder="you@example.com" required autocomplete="email"/>
      <div class="form-error" id="email-error"></div>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password <a href="forgot-password.html" class="forgot-link">Forgot password?</a></label>
      <div class="pw-wrapper">
        <input class="form-control" type="password" id="password" placeholder="Enter your password" required autocomplete="current-password"/>
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password visibility">
          <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="form-error" id="pw-error"></div>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px;" id="login-btn">
      <span id="login-text">Sign In</span>
      <span id="login-spinner" class="spinner spinner--sm" style="display:none;border-color:rgba(255,255,255,0.3);border-top-color:white;"></span>
    </button>
  </form>
  <div class="auth-footer">Don't have an account? <a href="signup.html">Create one free</a></div>
  <div class="auth-footer" style="margin-top:10px;"><a href="../index.html" style="color:var(--color-muted-text);">← Back to home</a></div>
</div>
<script type="module">
import { auth, db } from "../js/firebase/init.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { redirectIfLoggedIn } from "../js/components/auth-guard.js";
import toast from "../js/components/toast.js";

// Redirect if already logged in
redirectIfLoggedIn();

// Pre-select role from URL param
const urlRole = new URLSearchParams(window.location.search).get('role');
if (urlRole) {
  document.querySelectorAll('.role-tab').forEach(t => { t.classList.toggle('active', t.dataset.role === urlRole); t.setAttribute('aria-selected', t.dataset.role === urlRole); });
}

let selectedRole = urlRole || 'patient';
document.querySelectorAll('.role-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.role-tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', false); });
    tab.classList.add('active'); tab.setAttribute('aria-selected', true);
    selectedRole = tab.dataset.role;
  });
});

// Password toggle
const pwInput = document.getElementById('password');
const eyeIcon = document.getElementById('eye-icon');
document.getElementById('pw-toggle')?.addEventListener('click', () => {
  const isText = pwInput.type === 'text';
  pwInput.type = isText ? 'password' : 'text';
  eyeIcon.innerHTML = isText
    ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
});

// Login form
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  document.getElementById('email-error').textContent = '';
  document.getElementById('pw-error').textContent = '';
  if (!email) { document.getElementById('email-error').textContent = 'Email is required.'; return; }
  if (!password) { document.getElementById('pw-error').textContent = 'Password is required.'; return; }
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  document.getElementById('login-text').style.display = 'none';
  document.getElementById('login-spinner').style.display = 'inline-block';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const userDoc = await getDoc(doc(db, 'users', cred.user.uid));
    if (!userDoc.exists()) throw new Error('User record not found.');
    const role = userDoc.data().role;
    if (role !== selectedRole) {
      toast.error(`This account is registered as a ${role}, not a ${selectedRole}.`);
      btn.disabled = false;
      document.getElementById('login-text').style.display = '';
      document.getElementById('login-spinner').style.display = 'none';
      return;
    }
    toast.success('Login successful! Redirecting...');
    setTimeout(() => {
      if (role === 'patient') window.location.href = '/pages/patient/dashboard.html';
      else if (role === 'doctor') window.location.href = '/pages/doctor/dashboard.html';
      else if (role === 'admin') window.location.href = '/pages/admin/dashboard.html';
    }, 800);
  } catch (err) {
    btn.disabled = false;
    document.getElementById('login-text').style.display = '';
    document.getElementById('login-spinner').style.display = 'none';
    const msg = err.code === 'auth/invalid-credential' ? 'Invalid email or password.' : err.code === 'auth/too-many-requests' ? 'Too many attempts. Try again later.' : err.message;
    toast.error(msg, 'Login Failed');
  }
});
</script>
</body>
</html>
