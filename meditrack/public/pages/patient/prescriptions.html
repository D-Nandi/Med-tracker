<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Prescriptions - MediTrack</title><link rel="stylesheet" href="../../css/main.css"/></head>
<body>
<div id="toast-container"></div>
<div class="app-layout">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>
    <main class="page-content">
      <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <div><h2>My Prescriptions</h2><p>All your prescriptions from doctors</p></div>
        <div style="display:flex;gap:10px;">
          <input type="text" class="form-control" id="search-input" placeholder="Search prescriptions..." style="width:220px;"/>
        </div>
      </div>
      <div id="prescriptions-list"><div class="spinner" style="margin:60px auto;"></div></div>
    </main>
  </div>
</div>
<!-- Prescription Detail Modal -->
<div id="rx-modal" class="modal-overlay" style="display:none;">
  <div class="modal modal--lg">
    <div class="modal-header">
      <h2 class="modal-title">Prescription Details</h2>
      <button class="modal-close" id="close-rx-modal" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div id="rx-modal-content"></div>
  </div>
</div>
<script type="module" src="../../js/pages/patient-prescriptions.js"></script>
</body>
</html>
