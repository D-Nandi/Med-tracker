<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Admin Dashboard - MediTrack</title><link rel="stylesheet" href="../../css/main.css"/></head>
<body>
<div id="toast-container"></div>
<div class="app-layout">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>
    <main class="page-content">
      <div class="page-header"><h2>Admin Dashboard</h2><p>System-wide overview and analytics</p></div>
      <div class="stats-grid" id="stats-grid"></div>
      <div class="dashboard-grid" style="margin-top:24px;">
        <div class="card col-span-2">
          <div class="card-header"><span class="card-title">Recent Activity</span></div>
          <div id="recent-activity"><div class="spinner" style="margin:30px auto;"></div></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script type="module" src="../../js/pages/admin-dashboard.js"></script>
</body>
</html>
