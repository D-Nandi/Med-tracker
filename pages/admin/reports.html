<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>System Reports - MediTrack</title><link rel="stylesheet" href="../../css/main.css"/></head>
<body>
<div id="toast-container"></div>
<div class="app-layout">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>
    <main class="page-content">
      <div class="page-header"><h2>System Reports</h2><p>Analytics and system-wide reporting</p></div>
      <div class="stats-grid" id="summary-cards"></div>
      <div class="dashboard-grid" style="margin-top:24px;">
        <div class="card">
          <div class="card-header"><span class="card-title">Recent Reports</span></div>
          <div id="reports-table"><div class="spinner" style="margin:30px auto;"></div></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Appointment Summary</span></div>
          <div id="appointments-table"><div class="spinner" style="margin:30px auto;"></div></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script type="module" src="../../js/pages/admin-reports.js"></script>
</body>
</html>
