<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Prescriptions - MediTrack</title><link rel="stylesheet" href="../../css/main.css"/></head>
<body>
<div id="toast-container"></div>
<div class="app-layout">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="main-content">
    <header id="topbar" class="topbar"></header>
    <main class="page-content">
      <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <div><h2>Prescriptions</h2><p>Manage and create prescriptions for your patients</p></div>
        <button class="btn btn-primary" id="new-rx-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Prescription
        </button>
      </div>
      <div id="prescriptions-list"><div class="spinner" style="margin:60px auto;"></div></div>
    </main>
  </div>
</div>
<!-- New Prescription Modal -->
<div id="new-rx-modal" class="modal-overlay" style="display:none;">
  <div class="modal modal--lg">
    <div class="modal-header">
      <h2 class="modal-title">New Prescription</h2>
      <button class="modal-close" id="close-rx-modal" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <form id="rx-form" novalidate>
      <div class="form-group">
        <label class="form-label">Patient *</label>
        <input class="form-control" id="patient-search" placeholder="Search patient by name..." autocomplete="off"/>
        <div id="patient-results" style="display:none;position:absolute;z-index:10;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);max-height:180px;overflow-y:auto;width:100%;box-shadow:var(--shadow-md);"></div>
        <input type="hidden" id="selected-patient-id"/>
        <div id="selected-patient" style="display:none;margin-top:8px;padding:8px 12px;background:var(--color-primary-light);border-radius:var(--radius-sm);font-size:0.875rem;"></div>
      </div>
      <div class="form-group"><label class="form-label">Diagnosis *</label><textarea class="form-control" id="rx-diagnosis" rows="2" placeholder="e.g. Upper Respiratory Tract Infection" required></textarea></div>
      <div class="form-group">
        <label class="form-label">Medicines</label>
        <div id="medicines-rows"></div>
        <button type="button" class="btn btn-ghost btn-sm" id="add-medicine-row" style="margin-top:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Medicine
        </button>
      </div>
      <div class="form-group"><label class="form-label">Instructions / Notes</label><textarea class="form-control" id="rx-instructions" rows="2" placeholder="Additional instructions for the patient..."></textarea></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="cancel-rx">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-rx-btn">Create Prescription</button>
      </div>
    </form>
  </div>
</div>
<script type="module" src="../../js/pages/doctor-prescriptions.js"></script>
</body>
</html>
