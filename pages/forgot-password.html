<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - MediTrack</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#f0f9ff,#ecfeff,#f0fdf4);}
    .auth-card{width:100%;max-width:420px;background:white;border-radius:var(--radius-xl);padding:40px;box-shadow:var(--shadow-xl);border:1px solid var(--color-border);}
    .auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px;}
    .auth-logo-icon{width:44px;height:44px;background:var(--color-primary);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:white;}
    .auth-logo-text{font-family:var(--font-primary);font-weight:700;font-size:1.4rem;color:var(--color-foreground);}
    .auth-logo-text span{color:var(--color-primary);}
    .success-state{text-align:center;padding:20px 0;}
    .success-icon{width:64px;height:64px;background:var(--color-accent-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--color-accent);}
  </style>
</head>
<body>
<div id="toast-container"></div>
<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-logo-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
    <div class="auth-logo-text">Medi<span>Track</span></div>
  </div>
  <div id="form-section">
    <h1 style="text-align:center;font-size:1.5rem;font-weight:700;margin-bottom:8px;">Reset Password</h1>
    <p style="text-align:center;color:var(--color-muted-text);margin-bottom:28px;">Enter your email and we'll send you a reset link.</p>
    <form id="reset-form" novalidate>
      <div class="form-group"><label class="form-label" for="email">Email Address</label><input class="form-control" type="email" id="email" placeholder="you@example.com" required/><div class="form-error" id="email-error"></div></div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="reset-btn">Send Reset Link</button>
    </form>
    <div style="text-align:center;margin-top:20px;font-size:0.9rem;"><a href="login.html" style="color:var(--color-primary);font-weight:600;">← Back to login</a></div>
  </div>
  <div id="success-section" style="display:none;">
    <div class="success-state">
      <div class="success-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 13.01 9 10.01"/></svg></div>
      <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:8px;">Check Your Email</h2>
      <p style="color:var(--color-muted-text);margin-bottom:24px;">We've sent a password reset link to your email address. It expires in 1 hour.</p>
      <a href="login.html" class="btn btn-primary" style="width:100%;">Back to Login</a>
    </div>
  </div>
</div>
<script type="module">
import { auth } from "../js/firebase/init.js";
import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import toast from "../js/components/toast.js";
document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  document.getElementById('email-error').textContent = '';
  if (!email) { document.getElementById('email-error').textContent = 'Email is required.'; return; }
  const btn = document.getElementById('reset-btn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    await sendPasswordResetEmail(auth, email);
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('success-section').style.display = '';
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Send Reset Link';
    toast.error(err.code === 'auth/user-not-found' ? 'No account found with this email.' : err.message);
  }
});
</script>
</body>
</html>
